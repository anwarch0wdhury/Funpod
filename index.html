<style>
@property --h{syntax:'<number>';inherits:true;initial-value:215}
:root{--h:215;--w:min(92vw,calc((100dvh - 64px)*.615),420px);transition:--h 1.4s ease}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#07090f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:1em;height:1em;fill:currentColor;flex:none}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}
#bg i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;opacity:.5;will-change:transform;background:radial-gradient(circle,hsl(var(--h) 80% 45% / .7),transparent 68%)}
#bg i:nth-child(1){left:-30vmax;top:-30vmax;animation:d1 24s ease-in-out infinite alternate}
#bg i:nth-child(2){right:-35vmax;bottom:-25vmax;background:radial-gradient(circle,hsl(calc(var(--h) + 60) 75% 42% / .6),transparent 68%);animation:d2 30s ease-in-out infinite alternate}
#bg i:nth-child(3){left:10vmax;bottom:-45vmax;background:radial-gradient(circle,hsl(calc(var(--h) - 50) 80% 40% / .45),transparent 68%);animation:d3 27s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(20vmax,12vmax) scale(1.1)}}@keyframes d2{to{transform:translate(-18vmax,-12vmax) scale(.9)}}@keyframes d3{to{transform:translate(14vmax,-12vmax) scale(1.15)}}
#stage{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hint{margin:0;color:rgba(255,255,255,.5);font-size:12px;text-align:center;max-width:92vw;line-height:1.4}
/* device */
#dev{--b1:#f6f7f9;--b2:#cbcfd5;--w1:#fff;--w2:#dfe2e7;--lab:#8b919b;--c1:#f9fafb;--c2:#d3d7dd;
  font-size:calc(var(--w)/340*16);width:21.25em;padding:1.2em 1.2em 1.5em;border-radius:2.3em;position:relative;touch-action:manipulation;
  background:linear-gradient(160deg,var(--b1),var(--b2));
  box-shadow:0 2.4em 5em rgba(0,0,0,.55),0 .4em 1em rgba(0,0,0,.35),inset 0 .12em .12em rgba(255,255,255,.75),inset 0 -.2em .5em rgba(0,0,0,.2),inset 0 0 0 .08em rgba(0,0,0,.25);
  transition:background .5s}
#dev[data-theme=black]{--b1:#4a4c52;--b2:#17181b;--w1:#383a3f;--w2:#1c1d20;--lab:#b9bdc6;--c1:#2e2f33;--c2:#141517}
#dev[data-theme=teal]{--b1:#9be6e0;--b2:#2f9f98;--w1:#f7fdfc;--w2:#cfeae8;--lab:#3f8a85;--c1:#f2fbfa;--c2:#bfe0dd}
#dev[data-theme=red]{--b1:#ff8089;--b2:#a51d29;--w1:#fff6f6;--w2:#f0cdd0;--lab:#a24a52;--c1:#fff2f2;--c2:#e8bfc3}
.bezel{background:linear-gradient(180deg,#14161a,#2c2f35);border-radius:1em;padding:.4em;box-shadow:inset 0 .1em .4em #000,0 .08em .08em rgba(255,255,255,.5)}
#lcd{height:14.4em;border-radius:.65em;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#f4f9fd,#dbe6ef);color:#10202e;box-shadow:inset 0 0 1.4em rgba(20,60,100,.3)}
.lhead{height:1.8em;flex:none;display:grid;grid-template-columns:3.2em 1fr 3.2em;align-items:center;padding:0 .5em;background:linear-gradient(180deg,#fdfefe,#c7d4e0);border-bottom:.08em solid #8aa0b4;font-weight:800;font-size:.88em}

#center{position:absolute;left:50%;top:50%;width:5.8em;height:5.8em;margin:-2.9em 0 0 -2.9em;border-radius:50%;touch-action:manipulation;
  background:radial-gradient(circle at 50% 30%,var(--c1),var(--c2));
  box-shadow:inset 0 .1em .15em rgba(255,255,255,.85),inset 0 -.1em .3em rgba(0,0,0,.22),0 0 0 .1em rgba(0,0,0,.16),0 .1em .4em rgba(0,0,0,.28);transition:transform .1s,box-shadow .1s}

<script>

(function(){
'use strict';
const BUILD='1.0.0';
const $=s=>document.querySelector(s);
const audio=$('#audio');
const AUDIO_EXT=/\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|weba|wma|aif|aiff)$/i;
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',flac:'audio/flac',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',weba:'audio/webm',aif:'audio/aiff',aiff:'audio/aiff',wma:'audio/x-ms-wma'};
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isTouch=matchMedia('(pointer:coarse)').matches;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

/* ---------- helpers ---------- */
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(!s||!isFinite(s))return '';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hueOf=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h};
const mb=n=>n>=1e9?(n/1e9).toFixed(1)+' GB':Math.round(n/1e6)+' MB';
const icon=(id,cls)=>`<svg${cls?` class="${cls}"`:''}><use href="#i-${id}"/></svg>`;
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function vibrate(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}

/* ---------- storage (IndexedDB) ---------- */
const STORE='tracks';let dbp=null,persistOK=true;
function openDB(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('no idb'));
  const r=indexedDB.open('sonora',2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'key'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const db=()=>dbp||(dbp=openDB());
async function dbAll(){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbPut(rec){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=res;tx.onerror=tx.onabort=()=>rej(tx.error)})}
async function dbDel(key){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key);tx.oncomplete=res;tx.onerror=tx.onabort=()=>rej(tx.error)})}
const toRec=t=>({key:t.key,file:t.file,name:t.name,title:t.title,artist:t.artist,album:t.album,dur:t.dur,coverBlob:t.coverBlob||null,fav:!!t.fav,added:t.added});

/* ---------- state ---------- */
let tracks=[],byId=new Map(),byKey=new Map(),uid=0;
let view='all',query='',cur=null,queue=[],shuffle=false,repeat=0,objUrl=null,seeking=false,failStreak=0;
let sortMode=lsGet('sonora_sort','title');
const SORTS=[['title','Title'],['artist','Artist'],['recent','Recent']];

function addTrack(rec){
  const t=Object.assign({id:++uid,h:null,cover:null},rec);
  t.cover=rec.coverBlob?URL.createObjectURL(rec.coverBlob):null;
  tracks.push(t);byId.set(t.id,t);byKey.set(t.key,t);return t;
}
function sortTracks(){
  const c=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
  if(sortMode==='title')tracks.sort((a,b)=>c(a.title,b.title));
  else if(sortMode==='artist')tracks.sort((a,b)=>c(a.artist,b.artist)||c(a.title,b.title));
  else tracks.sort((a,b)=>b.added-a.added);
}

/* ---------- file name + ID3 ---------- */
function parseName(fn){
  const n=fn.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const m=n.match(/^(.+?)\s+-\s+(.+)$/);
  if(m)return{artist:m[1].replace(/^\d{1,3}[\s.\-]+/,'').trim()||'Unknown artist',title:m[2].trim()};
  return{title:n.replace(/^\d{1,3}[\s._-]+(?=\D)/,'')||n,artist:'Unknown artist'};
}
function decodeText(b){
  if(!b.length)return '';
  const enc=b[0];let d=b.subarray(1),label='windows-1252';
  if(enc===1){label='utf-16le';if(d[0]===0xFE&&d[1]===0xFF){label='utf-16be';d=d.subarray(2)}else if(d[0]===0xFF&&d[1]===0xFE)d=d.subarray(2)}
  else if(enc===2)label='utf-16be';else if(enc===3)label='utf-8';
  try{return new TextDecoder(label).decode(d).split('\0').filter(Boolean)[0]||''}catch(e){return ''}
}
async function readID3(file){
  const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
  if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33)return null;
  const ver=head[3];if(ver<3)return null;
  const size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
  const buf=new Uint8Array(await file.slice(10,10+Math.min(size,6e6)).arrayBuffer());
  const dv=new DataView(buf.buffer);let p=0;const out={};
  if(head[5]&0x40)p=ver===4?((buf[0]<<21)|(buf[1]<<14)|(buf[2]<<7)|buf[3]):dv.getUint32(0)+4;
  while(p+10<=buf.length){
    const id=String.fromCharCode(buf[p],buf[p+1],buf[p+2],buf[p+3]);
    if(!/^[A-Z0-9]{4}$/.test(id))break;
    const fs=ver===4?((buf[p+4]<<21)|(buf[p+5]<<14)|(buf[p+6]<<7)|buf[p+7]):dv.getUint32(p+4);
    const body=buf.subarray(p+10,p+10+fs);p+=10+fs;
    if(id==='TIT2')out.title=decodeText(body);
    else if(id==='TPE1')out.artist=decodeText(body);
    else if(id==='TALB')out.album=decodeText(body);
    else if(id==='APIC'&&!out.coverBlob&&body.length>100){
      const enc=body[0];let i=1;while(i<body.length&&body[i]!==0)i++;
      let mime=new TextDecoder('latin1').decode(body.subarray(1,i)).toLowerCase();i+=2;
      if(enc===1||enc===2){while(i+1<body.length&&!(body[i]===0&&body[i+1]===0))i+=2;i+=2}
      else{while(i<body.length&&body[i]!==0)i++;i++}
      if(!/^image\//.test(mime))mime=/png/.test(mime)?'image/png':'image/jpeg';
      const data=body.slice(i);if(data.length>100)out.coverBlob=new Blob([data],{type:mime});
    }
  }
  return out;
}
function getDur(f){return new Promise(res=>{
  const a=new Audio();a.preload='metadata';const u=URL.createObjectURL(f);let fin=false;
  const done=v=>{if(fin)return;fin=true;try{URL.revokeObjectURL(u)}catch(e){}a.removeAttribute('src');res(v)};
  a.onloadedmetadata=()=>done(isFinite(a.duration)?a.duration:0);a.onerror=()=>done(0);setTimeout(()=>done(0),5000);a.src=u})}
function coverHue(url){return new Promise(res=>{
  const im=new Image();
  im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(im,0,0,16,16);
    const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,w=0;
    for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),s=(mx-mn)+1;r+=d[i]*s;g+=d[i+1]*s;b+=d[i+2]*s;w+=s}
    r/=w;g/=w;b/=w;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<12)return res(null);
    let h;if(mx===r)h=((g-b)/(mx-mn))%6;else if(mx===g)h=(b-r)/(mx-mn)+2;else h=(r-g)/(mx-mn)+4;
    res(Math.round((h*60+360)%360))}catch(e){res(null)}};
  im.onerror=()=>res(null);im.src=url})}

/* ---------- import ---------- */
const isAudio=f=>(f.type&&f.type.startsWith('audio/'))||AUDIO_EXT.test(f.name);
const keyOf=f=>f.name+'|'+f.size;
async function importOne(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  const blob=f.type?f:new Blob([f],{type:MIME[ext]||'audio/mpeg'});
  const g=(await readID3(f).catch(()=>null))||{};
  const dur=await getDur(blob);
  const base=parseName(f.name);
  const rec={key:keyOf(f),file:blob,name:f.name,title:g.title||base.title,artist:g.artist||base.artist,album:g.album||'',dur,coverBlob:g.coverBlob||null,fav:false,added:Date.now()};
  if(persistOK){try{await dbPut(rec)}catch(e){if(e&&e.name==='QuotaExceededError')throw e;persistOK=false;toast('Saving is unavailable here, songs last until you close the app')}}
  addTrack(rec);
}
let importing=false;
async function importFiles(list){
  if(importing){toast('Still importing…');return}
  const files=list.filter(isAudio);
  if(!files.length){toast('No audio files found');return}
  const fresh=files.filter(f=>!byKey.has(keyOf(f)));
  if(!fresh.length){toast('Already in your library');return}
  importing=true;closeSheet();
  const imp=$('#imp');imp.hidden=false;
  let done=0,added=0,full=false;const total=fresh.length;
  const upd=()=>{$('#impTxt').textContent=`Adding music… ${done} of ${total}`;$('#impBar').style.width=(done/total*100)+'%'};upd();
  const q=fresh.slice();
  async function worker(){
    while(q.length&&!full){
      const f=q.shift();
      try{await importOne(f);added++}catch(e){if(e&&e.name==='QuotaExceededError'){full=true}}
      done++;upd();if(done%5===0){sortTracks();render()}
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  importing=false;imp.hidden=true;sortTracks();render(true);
  toast(full?`Storage full, added ${added} of ${total}`:`Added ${added} song${added===1?'':'s'}`);
  const probe=new Audio(),bad=new Set();
  fresh.forEach(f=>{const ext=(f.name.split('.').pop()||'').toLowerCase();if(!probe.canPlayType(f.type||MIME[ext]||'audio/mpeg'))bad.add(ext.toUpperCase())});
  if(bad.size)setTimeout(()=>toast(`${[...bad].join(', ')} may not play on this device`),2700);
  try{const pr=navigator.storage&&navigator.storage.persist&&navigator.storage.persist();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
}
async function scanDir(dh){
  toast('Scanning folder…');const files=[];
  async function walk(d){for await(const [name,h] of d.entries()){
    if(h.kind==='file'){if(AUDIO_EXT.test(name)){try{files.push(await h.getFile())}catch(e){}}}else await walk(h)}}
  await walk(dh);importFiles(files);
}
async function pickFolder(){
  if(window.showDirectoryPicker){
    try{const h=await window.showDirectoryPicker({mode:'read'});await scanDir(h);return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  $('#inFolder').click();
}
$('#inFiles').onchange=e=>{importFiles(Array.from(e.target.files));e.target.value=''};
$('#inFolder').onchange=e=>{importFiles(Array.from(e.target.files));e.target.value=''};
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)importFiles(Array.from(e.dataTransfer.files))});


/* ===================== click-wheel UI ===================== */
const cfg={body:lsGet('sonora_body','silver'),click:lsGet('sonora_click',isIOS?'0':'1')==='1'};
const BODIES=['silver','black','teal','red'],BODY_NAMES={silver:'Silver',black:'Black',teal:'Teal',red:'Red'};
const dev=$('#dev'),lbody=$('#lbody'),ROWS=7;
let stack=[],scr=null,npMode=isIOS?'scrub':'vol',volT=null;
const cmp=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
const favCount=()=>tracks.reduce((n,t)=>n+(t.fav?1:0),0);
function artStyle(t){
  if(t.cover)return `background-image:url("${t.cover}")`;
  const h=hueOf(t.title+t.artist);
  return `background:linear-gradient(135deg,hsl(${h} 60% 45%),hsl(${(h+50)%360} 65% 25%))`;
}
function applyBody(){dev.dataset.theme=cfg.body}
function applyTheme(t){document.documentElement.style.setProperty('--h',t?(t.h!=null?t.h:hueOf(t.title+t.artist)):215)}
function render(){renderLCD()}
function closeSheet(){}

/* --- navigation --- */
function go(build){stack.push({build,sel:0,top:0});renderLCD()}
function back(){if(stack.length>1){stack.pop();renderLCD()}}
function renderLCD(){
  const sc=stack[stack.length-1];if(!sc)return;
  const def=sc.build();scr={sc,def};
  $('#hTitle').textContent=def.title;
  if(def.np)renderNP();else paintList();
}
function paintList(){
  const {sc,def}=scr,items=def.items,n=items.length;
  if(sc.sel>=n)sc.sel=Math.max(0,n-1);
  if(sc.sel<sc.top)sc.top=sc.sel;
  if(sc.sel>=sc.top+ROWS)sc.top=sc.sel-ROWS+1;
  sc.top=Math.max(0,Math.min(sc.top,Math.max(0,n-ROWS)));
  let h='';
  for(let i=sc.top;i<Math.min(n,sc.top+ROWS);i++){
    const it=items[i];
    h+=`<div class="lrow${i===sc.sel?' sel':''}${it.dis?' dis':''}"><span class="lt">${it.playing?icon('vol','spk'):''}${esc(it.label)}</span>${it.right?`<span class="lr">${esc(it.right)}</span>`:''}${it.go?'<span class="chev">›</span>':''}</div>`;
  }
  let sb='';
  if(n>ROWS){const th=ROWS/n*100,tt=sc.top/(n-ROWS)*(100-th);sb=`<div class="sbar"><i style="height:${th}%;top:${tt}%"></i></div>`}
  lbody.innerHTML=`<div class="list">${h}</div>${sb}`;
}

/* --- actions from the wheel --- */
let actx=null;
function tick(){
  vibrate(3);
  if(!cfg.click)return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=2000;g.gain.value=.05;
    o.connect(g);g.connect(actx.destination);o.start();g.gain.setTargetAtTime(0,actx.currentTime+.004,.004);o.stop(actx.currentTime+.03);
  }catch(e){}
}
function wheelStep(d){
  if(!scr)return;tick();
  if(scr.def.np){npWheel(d);return}
  const sc=scr.sc,n=scr.def.items.length;if(!n)return;
  const ns=Math.max(0,Math.min(n-1,sc.sel+d));if(ns===sc.sel)return;
  sc.sel=ns;paintList();
}
function selectItem(){
  if(!scr)return;
  if(scr.def.np){npCenter();return}
  const it=scr.def.items[scr.sc.sel];if(it&&!it.dis&&it.onSelect)it.onSelect();
}
function holdItem(){
  if(!scr)return;
  if(scr.def.np){const t=byId.get(cur);if(t)go(()=>optionsDef(t));return}
  const it=scr.def.items[scr.sc.sel];if(it&&it.onHold)it.onHold();
}
function playPauseKey(){
  if(cur!=null)togglePlay();
  else if(tracks.length){queue=tracks.map(t=>t.id);play(queue[0])}
  else toast('Add music first');
}
function startFrom(list,id){queue=list.map(t=>t.id);play(id);go(npDef)}
function shuffleAll(){
  if(!tracks.length){toast('Add music first');return}
  setShuffle(true);queue=tracks.map(t=>t.id);play(queue[Math.random()*queue.length|0]);go(npDef);
}
function setShuffle(v){shuffle=v;setHeader()}

/* --- screens --- */
const mainDef=()=>({title:'Sonora',items:[
  {label:'Music',go:true,onSelect:()=>go(musicDef)},
  {label:'Favorites',go:true,right:favCount()?String(favCount()):'',onSelect:()=>go(favDef)},
  ...(cur!=null?[{label:'Now Playing',go:true,onSelect:()=>go(npDef)}]:[]),
  {label:'Shuffle Songs',onSelect:shuffleAll},
  {label:'Add Music',go:true,onSelect:()=>go(addDef)},
  {label:'Settings',go:true,onSelect:()=>go(settingsDef)}]});
const trackItems=(arr,empty)=>arr.length?arr.map(t=>({label:t.title,right:t.fav?'♥':'',playing:t.id===cur,
  onSelect:()=>startFrom(arr,t.id),onHold:()=>go(()=>optionsDef(t))})):[{label:empty||'No songs',dis:true}];
const songsDef=(get,title)=>()=>({title,items:trackItems(get(),title==='Favorites'?'No favorites yet':'No songs yet')});
const favDef=songsDef(()=>tracks.filter(t=>t.fav),'Favorites');
const allSongsDef=songsDef(()=>tracks,'Songs');
const recentDef=songsDef(()=>tracks.slice().sort((a,b)=>b.added-a.added),'Recently Added');
const musicDef=()=>({title:'Music',items:[
  {label:'Songs',go:true,right:String(tracks.length),onSelect:()=>go(allSongsDef)},
  {label:'Artists',go:true,onSelect:()=>go(artistsDef)},
  {label:'Albums',go:true,onSelect:()=>go(albumsDef)},
  {label:'Recently Added',go:true,onSelect:()=>go(recentDef)}]});
function groupDef(title,key,unknown){
  return ()=>{
    const m=new Map();tracks.forEach(t=>{const k=t[key]||unknown;m.set(k,(m.get(k)||0)+1)});
    const names=[...m.keys()].sort(cmp);
    return{title,items:names.length?names.map(n=>({label:n,right:String(m.get(n)),go:true,
      onSelect:()=>go(songsDef(()=>tracks.filter(t=>(t[key]||unknown)===n),n))})):[{label:'Nothing here yet',dis:true}]};
  };
}
const artistsDef=groupDef('Artists','artist','Unknown artist');
const albumsDef=groupDef('Albums','album','Unknown album');
const showFolder=!isTouch||!!window.showDirectoryPicker;
const addDef=()=>({title:'Add Music',items:[
  {label:'Choose Files',onSelect:()=>$('#inFiles').click()},
  ...(showFolder?[{label:'Choose Folder',onSelect:pickFolder}]:[]),
  {label:tracks.length+' songs stored',dis:true},
  {label:'Copied into Sonora, works offline',dis:true},
  {label:'Nothing is uploaded',dis:true}]});
const settingsDef=()=>({title:'Settings',items:[
  {label:'Shuffle',right:shuffle?'On':'Off',onSelect:()=>{setShuffle(!shuffle);renderLCD()}},
  {label:'Repeat',right:['Off','All','One'][repeat],onSelect:()=>{repeat=(repeat+1)%3;setHeader();renderLCD()}},
  {label:'Sort Songs',right:SORTS.find(s=>s[0]===sortMode)[1],onSelect:()=>{
    sortMode=SORTS[(SORTS.findIndex(s=>s[0]===sortMode)+1)%SORTS.length][0];lsSet('sonora_sort',sortMode);sortTracks();renderLCD()}},
  {label:'Color',right:BODY_NAMES[cfg.body],onSelect:()=>{cfg.body=BODIES[(BODIES.indexOf(cfg.body)+1)%BODIES.length];lsSet('sonora_body',cfg.body);applyBody();renderLCD()}},
  {label:'Click Sound',right:cfg.click?'On':'Off',onSelect:()=>{cfg.click=!cfg.click;lsSet('sonora_click',cfg.click?'1':'0');renderLCD()}},
  {label:'Help',go:true,onSelect:()=>go(helpDef)},
  {label:'Delete All Songs',go:true,onSelect:()=>go(confirmAllDef)}]});
const helpDef=()=>({title:'Help',items:[
  'Drag around the wheel: scroll','Tap center: select','Hold center: song options','Tap MENU: go back',
  'Tap right/left: next/previous','Tap bottom: play or pause','Now Playing: wheel = volume','  (iPhone: wheel = scrub)',
  'Center in Now Playing: switch','Songs stay on this device'].map(l=>({label:l,dis:true}))});
const optionsDef=t=>({title:'Options',items:[
  {label:'Play',onSelect:()=>{stack.pop();startFrom(tracks,t.id)}},
  {label:t.fav?'Remove Favorite':'Add to Favorites',onSelect:async()=>{stack.pop();await toggleFav(t)}},
  {label:'Delete Song',go:true,onSelect:()=>go(()=>confirmDef(t))}]});
const confirmDef=t=>({title:'Delete song?',items:[
  {label:'Cancel',onSelect:back},
  {label:'Delete',onSelect:async()=>{await removeTrack(t);stack.splice(-2);renderLCD()}}]});
const confirmAllDef=()=>({title:'Delete all?',items:[
  {label:'Cancel',onSelect:back},
  {label:'Delete everything',onSelect:async()=>{await clearAll();stack=[stack[0]];renderLCD()}}]});
const npDef=()=>({title:'Now Playing',np:true});

/* --- Now Playing --- */
function renderNP(){
  const t=byId.get(cur);
  if(!t){lbody.innerHTML='<div class="none">Nothing playing<br><small>Pick a song from Music</small></div>';return}
  const idx=queue.indexOf(cur)+1;
  lbody.innerHTML=`<div class="np"><div class="npmain"><div class="npart" style='${artStyle(t)}'>${t.cover?'':icon('note')}</div>
  <div class="npinfo"><div class="npt">${esc(t.title)}</div><div class="npa">${esc(t.artist)}</div><div class="npal">${esc(t.album||'')}</div>
  <div class="npn">${idx} of ${queue.length}${t.fav?' · ♥':''}</div></div></div>
  <div><div class="trk"><i id="npP"></i></div><div class="tms"><span id="npE">0:00</span><span id="npM">-0:00</span></div></div>
  <div class="npfoot" id="npMode"></div>
  <div class="volpop" id="volpop"><span id="volLbl">Volume</span><div class="trk"><i id="volI"></i></div></div></div>`;
  npProgress();npModeLbl();
}
function npProgress(){
  const p=$('#npP');if(!p)return;
  const d=audio.duration,c=audio.currentTime||0;
  p.style.width=(isFinite(d)&&d>0?c/d*100:0)+'%';
  $('#npE').textContent=fmt(c)||'0:00';
  $('#npM').textContent=isFinite(d)&&d>0?'-'+(fmt(d-c)||'0:00'):'-0:00';
}
function npModeLbl(){const m=$('#npMode');if(m)m.textContent=(isIOS||npMode==='scrub')?'Wheel: scrub':'Wheel: volume'}
function npWheel(d){
  if(isIOS||npMode==='scrub'){
    if(isFinite(audio.duration))audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+d*5));
    npProgress();
  }else{
    audio.volume=Math.max(0,Math.min(1,Math.round((audio.volume+d*.05)*100)/100));
    const vp=$('#volpop');if(!vp)return;
    $('#volLbl').textContent='Volume '+Math.round(audio.volume*100)+'%';$('#volI').style.width=audio.volume*100+'%';
    vp.classList.add('show');clearTimeout(volT);volT=setTimeout(()=>vp.classList.remove('show'),1200);
  }
}
function npCenter(){
  if(isIOS){togglePlay();return}
  npMode=npMode==='vol'?'scrub':'vol';npModeLbl();
}

/* --- header --- */
function setHeader(){
  const p=audio.paused;
  $('#hPlay').innerHTML=cur==null?'':icon(p?'pause':'play');
  $('#hIcons').innerHTML=(shuffle?icon('shuffle'):'')+(repeat?icon(repeat===2?'repeat1':'repeat'):'');
}

/* --- library edits --- */
async function toggleFav(t){
  if(!t)return;t.fav=!t.fav;
  try{await dbPut(toRec(t))}catch(e){}
  toast(t.fav?'Added to Favorites':'Removed from Favorites');renderLCD();
}
async function removeTrack(t){
  try{await dbDel(t.key)}catch(e){}
  if(cur===t.id){audio.pause();audio.removeAttribute('src');cur=null;applyTheme(null);setHeader()}
  tracks=tracks.filter(x=>x.id!==t.id);byId.delete(t.id);byKey.delete(t.key);queue=queue.filter(i=>i!==t.id);
  if(t.cover)URL.revokeObjectURL(t.cover);
  toast('Song deleted');
}
async function clearAll(){
  audio.pause();audio.removeAttribute('src');cur=null;queue=[];applyTheme(null);
  for(const t of tracks){try{await dbDel(t.key)}catch(e){}if(t.cover)URL.revokeObjectURL(t.cover)}
  tracks=[];byId.clear();byKey.clear();setHeader();toast('Library cleared');
}

/* ===================== playback ===================== */
let retried=null,tried2=false,loadTok=0;
const mimeOf=t=>{const ext=(t.name.split('.').pop()||'').toLowerCase();return t.file.type||MIME[ext]||'audio/mpeg'};
function setSrcFrom(blob){
  if(objUrl)URL.revokeObjectURL(objUrl);
  objUrl=URL.createObjectURL(blob);audio.src=objUrl;
  const p=audio.play();
  if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError')toast('Press ⏯ to start');else if(e&&e.name!=='AbortError')console.warn(e)});
}
async function fromMemory(t,tok){
  try{const blob=new Blob([await t.file.arrayBuffer()],{type:mimeOf(t)});if(tok===loadTok&&cur===t.id)setSrcFrom(blob);return true}catch(e){return false}
}
function play(id){
  const t=byId.get(id);if(!t)return;
  cur=id;retried=null;tried2=false;const tok=++loadTok;
  setSrcFrom(t.file);                       /* synchronous, inside the tap */
  setSession(t);applyTheme(t);setHeader();
  const ok=()=>audio.currentTime>0||(!audio.paused&&audio.readyState>=3);
  setTimeout(async()=>{
    if(tok!==loadTok||cur!==t.id||ok())return;
    tried2=true;await fromMemory(t,tok);
    setTimeout(()=>{if(tok!==loadTok||cur!==t.id||ok())return;
      const ext=(t.name.split('.').pop()||'?').toUpperCase();
      toast(`Couldn't start ${ext} (${Math.round(t.file.size/1e5)/10} MB, state ${audio.readyState}/${audio.networkState})`)},3500);
  },2500);
  if(t.cover&&t.h==null)coverHue(t.cover).then(h=>{if(h!=null){t.h=h;if(cur===t.id)applyTheme(t)}});
  if(scr&&scr.def.np)renderLCD();
}
function togglePlay(){if(cur==null)return;if(audio.paused)audio.play().catch(()=>{});else audio.pause()}
function next(auto){
  if(!queue.length)return;
  if(auto&&repeat===2){audio.currentTime=0;audio.play();return}
  if(shuffle&&queue.length>1){let n;do{n=queue[Math.random()*queue.length|0]}while(n===cur);return play(n)}
  let i=queue.indexOf(cur)+1;
  if(i>=queue.length){if(auto&&repeat===0){audio.pause();audio.currentTime=0;return}i=0}
  play(queue[i]);
}
function prev(){
  if(audio.currentTime>3){audio.currentTime=0;return}
  let i=queue.indexOf(cur)-1;if(i<0)i=queue.length-1;if(queue.length)play(queue[i]);
}
audio.addEventListener('ended',()=>next(true));
audio.addEventListener('playing',()=>{failStreak=0});
audio.addEventListener('play',setHeader);audio.addEventListener('pause',setHeader);
audio.addEventListener('timeupdate',()=>{if(scr&&scr.def.np)npProgress()});
audio.addEventListener('error',async()=>{
  const t=byId.get(cur);if(!t||!audio.getAttribute('src'))return;
  const code=audio.error&&audio.error.code;
  if(retried!==t.id){retried=t.id;if(await fromMemory(t,loadTok))return}
  const ext=(t.name.split('.').pop()||'').toUpperCase();
  toast(code===4?`${ext} can't be played on this device`:`Couldn't play this file (error ${code||'?'})`);
  failStreak++;if(failStreak<4&&queue.length>1)setTimeout(()=>next(true),900);
});
function setSession(t){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album||'',artwork:t.cover?[{src:t.cover,sizes:'512x512'}]:[{src:'icons/icon-512.png',sizes:'512x512',type:'image/png'}]});
    const h=navigator.mediaSession.setActionHandler.bind(navigator.mediaSession);
    h('play',()=>audio.play());h('pause',()=>audio.pause());h('previoustrack',prev);h('nexttrack',()=>next(false));
    h('seekto',d=>{audio.currentTime=d.seekTime});
  }catch(e){}
}

/* ===================== wheel input ===================== */
(function(){
  const wheel=$('#wheel'),center=$('#center');
  let drag=null,lastDragEnd=0,holdT=null,holdFired=false,rot=0;
  wheel.addEventListener('pointerdown',e=>{
    if(e.target.closest('#center'))return;
    const r=wheel.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    drag={cx,cy,last:Math.atan2(e.clientY-cy,e.clientX-cx),acc:0,total:0,moved:false};
    try{wheel.setPointerCapture(e.pointerId)}catch(_){}
  });
  wheel.addEventListener('pointermove',e=>{
    if(!drag)return;
    const a=Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx);
    let d=a-drag.last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
    drag.last=a;drag.total+=Math.abs(d);
    if(!drag.moved&&drag.total>.2)drag.moved=true;
    if(!drag.moved)return;
    rot+=d*180/Math.PI;wheel.style.setProperty('--rot',rot.toFixed(1));
    drag.acc+=d;const STEP=.42;
    while(drag.acc>=STEP){drag.acc-=STEP;wheelStep(1)}
    while(drag.acc<=-STEP){drag.acc+=STEP;wheelStep(-1)}
  });
  const end=()=>{if(drag&&drag.moved)lastDragEnd=performance.now();drag=null};
  wheel.addEventListener('pointerup',end);wheel.addEventListener('pointercancel',end);
  function flash(cls){const el=wheel.querySelector('.lb.'+cls);if(!el)return;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),160)}
  wheel.addEventListener('click',e=>{
    if(e.target.closest('#center'))return;
    if(performance.now()-lastDragEnd<400)return;           /* the end of a spin is not a tap */
    const r=wheel.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const ang=Math.atan2(dy,dx)*180/Math.PI;
    tick();
    if(ang<-45&&ang>=-135){flash('menu');back()}
    else if(ang>=-45&&ang<45){flash('next');next(false)}
    else if(ang>=45&&ang<135){flash('play');playPauseKey()}
    else{flash('prev');prev()}
  });
  /* center button: tap = select, hold = options */
  center.addEventListener('pointerdown',()=>{holdFired=false;clearTimeout(holdT);holdT=setTimeout(()=>{holdFired=true;vibrate(15);holdItem()},550)});
  const cancel=()=>clearTimeout(holdT);
  center.addEventListener('pointerup',cancel);center.addEventListener('pointerleave',cancel);center.addEventListener('pointercancel',cancel);
  center.addEventListener('click',()=>{if(holdFired){holdFired=false;return}tick();selectItem()});
  center.addEventListener('contextmenu',e=>e.preventDefault());
  /* desktop: mouse wheel and keyboard */
  let wacc=0;
  dev.addEventListener('wheel',e=>{e.preventDefault();wacc+=e.deltaY;while(wacc>=45){wacc-=45;wheelStep(1)}while(wacc<=-45){wacc+=45;wheelStep(-1)}},{passive:false});
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT')return;
    if(e.code==='ArrowDown')wheelStep(1);else if(e.code==='ArrowUp')wheelStep(-1);
    else if(e.code==='Enter'){e.preventDefault();selectItem()}
    else if(e.code==='Escape'||e.code==='Backspace')back();
    else if(e.code==='Space'){e.preventDefault();playPauseKey()}
    else if(e.code==='ArrowRight')next(false);else if(e.code==='ArrowLeft')prev();
  });
})();

/* ===================== start ===================== */
(async function start(){
  stack=[{build:mainDef,sel:0,top:0}];applyBody();applyTheme(null);
  try{audio.volume=.85}catch(e){}
  renderLCD();
  try{const recs=await dbAll();recs.forEach(addTrack);sortTracks();renderLCD()}catch(e){}
  try{
    const last=lsGet('sonora_build','');
    if(last&&last!==BUILD)toast('Updated to version '+BUILD);
    lsSet('sonora_build',BUILD);
  }catch(e){}
})();
addEventListener('online',()=>toast('Back online'));
addEventListener('offline',()=>toast('Offline: your music still works'));
try{
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    addEventListener('load',()=>{
      try{navigator.serviceWorker.register('sw.js').then(reg=>{
        reg.update().catch(()=>{});
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
      }).catch(()=>{})}catch(e){}
    });
  }
}catch(e){}
})();
